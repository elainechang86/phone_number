<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手機號碼隨機產生器</title>
<meta name="description" content="confi_studio">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#202124;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#1d4ed8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{width:min(920px,calc(100% - 32px));margin:44px auto}.header{margin-bottom:22px}h1{margin:0 0 8px;font-size:clamp(28px,5vw,40px)}.subtitle{margin:0;color:var(--muted);line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
.controls{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}label{display:block;font-weight:700;margin-bottom:8px}
input,button{width:100%;min-height:46px;border-radius:10px;font:inherit}input{padding:0 12px;border:1px solid #d1d5db}button{padding:0 18px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}button:hover{background:var(--accent2)}button:disabled{opacity:.5;cursor:not-allowed}
.stats{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;margin-top:15px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.result-head h2{margin:0;font-size:20px}
.actions{display:flex;gap:8px}.actions button{width:auto;min-height:40px;background:#111827}.actions .ghost{background:#fff;color:#374151;border:1px solid #d1d5db}
.results,.history-numbers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;max-height:520px;overflow:auto}.number,.history-number{padding:11px 13px;background:#f9fafb;border:1px solid #eef0f2;border-radius:9px;font-variant-numeric:tabular-nums;letter-spacing:.04em}.empty,.history-empty{text-align:center;color:var(--muted);padding:26px 0}
.history-item{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fafafa}.history-summary{display:flex;justify-content:space-between;gap:12px;padding:13px 15px;cursor:pointer;list-style:none}.history-summary::-webkit-details-marker{display:none}.history-title{font-weight:700}.history-meta{color:var(--muted);font-size:13px;margin-top:3px}.history-body{padding:0 15px 15px;border-top:1px solid var(--line)}.history-numbers{padding-top:12px;max-height:360px}.history-copy{margin-top:12px;width:auto;min-height:38px}
.notice{background:#eef2ff;border-radius:12px;padding:13px 15px;line-height:1.65;color:#3730a3;font-size:14px}.footer{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;margin-top:24px}
@media(max-width:680px){.wrap{margin:24px auto}.card{padding:18px;border-radius:14px}.controls{grid-template-columns:1fr}.results,.history-numbers{grid-template-columns:1fr}.result-head{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.stats{flex-direction:column}}
</style>
</head>
<body>
<main class="wrap">
<header class="header"><h1>手機號碼隨機產生器</h1><p class="subtitle">confi_studio</p></header>

<section class="card">
<div class="controls">
<div><label for="count">產生數量</label><input id="count" type="number" min="1" max="1000" value="100"></div>
<button id="generate">產生手機號碼</button>
</div>
<div class="stats"><span id="status">準備完成</span><span>共用累計已產生：<strong id="total">0</strong> 筆</span></div>
</section>

<section class="card">
<div class="result-head"><h2>本次產生結果</h2><div class="actions"><button id="copy" disabled>複製全部</button><button id="csv" class="ghost" disabled>下載 CSV</button></div></div>
<div id="results" class="results"><div class="empty">按下「產生手機號碼」開始。</div></div>
</section>

<section class="card">
<div class="result-head"><h2>生成歷史紀錄</h2><div class="actions"><button id="historyCsv" class="ghost" disabled>下載歷史 CSV</button></div></div>
<div id="history"><div class="history-empty">載入中…</div></div>
</section>

<div class="notice">這個版本使用共用資料庫，所有使用同一網址的人會看到相同的生成歷史~</div>
<p class="footer">本工具只產生符合指定門號區塊格式的號碼，不代表該號碼目前實際已被配發或可使用。</p>
</main>

<script>
/* =========================================================
   ① 第一次使用前，請在這裡填入你的 Supabase Project URL
      與 anon public key。
   ② 不要放 service_role key。
   ========================================================= */
const SUPABASE_URL = "https://wlmijcqwwvkwgfsswdho.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_I1LZJeCza9LL3AlnD0EF-Q_folJtGMJ";

const prefixGroups = [
["09006","09009"],["0905"],["0910"],["0911"],["0912"],["0919"],["0921"],["0928"],["0932"],["0933"],["09340","09344"],["0937"],["0963"],["09650","09658"],["09664","09667"],["0972"],["09740","09741"],["0975"],["0978"],["09842","09843"],["0988"],
["09000","09005"],["0903"],["0913"],["0915"],["0916"],["0917"],["0925"],["0926"],["0927"],["0930"],["09310","09313"],["0936"],["0938"],["09540","09541"],["0955"],["09605","09609"],["09620"],["09668","09669"],["09670","09673"],["09680","09681"],["09742","09743"],["0976"],["0981"],["09840","09841"],["0989"],
["0906"],["0907"],["09682","09685"],["09770","09777"],["0980"],["0982"],["0985"],
["09020","09026"],["0908"],["09686","09689"],["09712","09718"],["0973"],["0986"],
["09010","09014"],["0909"],["09140","09142"],["0918"],["0920"],["0922"],["0923"],["09240","09241"],["0929"],["09314","09319"],["0935"],["0939"],["0952"],["0953"],["0956"],["0958"],["09600","09604"],["09610","09615"],["09660","09663"],["0970"],["09710","09711"],["09744","09745"],["0979"],["0983"],["09844","09845"],["0987"]
];

const supabaseReady = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";
const db = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let currentResults = [];

function expandGroups(){
  const out=[];
  for(const g of prefixGroups){
    if(g.length===1) out.push(g[0]);
    else for(let n=Number(g[0]);n<=Number(g[1]);n++) out.push(String(n));
  }
  return out;
}
const prefixes=expandGroups();
function randomDigits(n){let s="";for(let i=0;i<n;i++)s+=Math.floor(Math.random()*10);return s}
function formatNumber(n){return n.slice(0,4)+"-"+n.slice(4,7)+"-"+n.slice(7)}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

async function loadStats(){
  if(!db){document.getElementById("status").textContent="尚未設定 Supabase";return}
  const {count,error}=await db.from("phone_numbers").select("*",{count:"exact",head:true});
  if(error){document.getElementById("status").textContent="資料庫連線失敗";console.error(error);return}
  document.getElementById("total").textContent=(count||0).toLocaleString();
  document.getElementById("status").textContent="共用資料庫已連線";
}

async function loadHistory(){
  const box=document.getElementById("history"), exportBtn=document.getElementById("historyCsv");
  if(!db){box.innerHTML='<div class="history-empty">請先設定 Supabase。</div>';return}
  const {data,error}=await db.from("generation_batches").select("id,created_at,count,phone_numbers").order("created_at",{ascending:false}).limit(100);
  if(error){box.innerHTML='<div class="history-empty">無法載入歷史紀錄。</div>';console.error(error);return}
  exportBtn.disabled=!data?.length;
  if(!data?.length){box.innerHTML='<div class="history-empty">目前還沒有生成歷史紀錄。</div>';return}
  box.innerHTML=data.map((r,i)=>`
    <details class="history-item" ${i===0?"open":""}>
      <summary class="history-summary"><div><div class="history-title">第 ${data.length-i} 次生成・${r.count} 筆</div><div class="history-meta">${new Date(r.created_at).toLocaleString("zh-TW",{hour12:false})}</div></div><span>⌄</span></summary>
      <div class="history-body"><div class="history-numbers">${(r.phone_numbers||[]).map(n=>`<div class="history-number">${formatNumber(n)}</div>`).join("")}</div><button class="history-copy" data-id="${r.id}">複製這次全部號碼</button></div>
    </details>`).join("");
  box.querySelectorAll(".history-copy").forEach(btn=>btn.onclick=async()=>{
    const r=data.find(x=>x.id===btn.dataset.id); if(!r)return;
    try{await navigator.clipboard.writeText(r.phone_numbers.map(formatNumber).join("\n"));btn.textContent="已複製 ✓";setTimeout(()=>btn.textContent="複製這次全部號碼",1200)}catch{alert("複製失敗。")}
  });
}

async function generate(){
  if(!db){alert("請先設定 Supabase URL 與 anon key，再上傳 GitHub。");return}
  const count=Number(document.getElementById("count").value);
  if(!Number.isInteger(count)||count<1||count>1000){alert("請輸入 1～1,000 之間的整數。");return}
  const btn=document.getElementById("generate");btn.disabled=true;btn.textContent="產生中…";
  try{
    /* 用資料庫 RPC 原子處理：同時多人使用也不會因競速而重複。 */
    const {data,error}=await db.rpc("generate_phone_numbers",{requested_count:count});
    if(error)throw error;
    currentResults=(data||[]).map(x=>x.phone_number);
    renderResults();
    document.getElementById("status").textContent=`本次產生 ${currentResults.length} 筆`;
    document.getElementById("copy").disabled=!currentResults.length;
    document.getElementById("csv").disabled=!currentResults.length;
    await loadStats(); await loadHistory();
  }catch(e){console.error(e);alert("產生失敗："+(e.message||e))}
  finally{btn.disabled=false;btn.textContent="產生手機號碼"}
}

function renderResults(){
  const box=document.getElementById("results");
  box.innerHTML=currentResults.length?currentResults.map(n=>`<div class="number">${formatNumber(n)}</div>`).join(""):'<div class="empty">沒有資料。</div>';
}
document.getElementById("generate").onclick=generate;
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(currentResults.map(formatNumber).join("\n"));const b=document.getElementById("copy"),o=b.textContent;b.textContent="已複製 ✓";setTimeout(()=>b.textContent=o,1200)}catch{alert("複製失敗。")}};
document.getElementById("csv").onclick=()=>downloadCsv([["手機號碼"],...currentResults.map(n=>[n])],`手機號碼_${new Date().toISOString().slice(0,10)}.csv`);
document.getElementById("historyCsv").onclick=async()=>{
  if(!db)return;
  const {data,error}=await db.from("generation_batches").select("created_at,count,phone_numbers").order("created_at",{ascending:true});
  if(error){alert("無法下載歷史紀錄。");return}
  const rows=[["生成次數","生成時間","手機號碼"]];data.forEach((r,i)=>(r.phone_numbers||[]).forEach(n=>rows.push([i+1,new Date(r.created_at).toLocaleString("zh-TW",{hour12:false}),n])));
  downloadCsv(rows,`生成歷史_${new Date().toISOString().slice(0,10)}.csv`);
};
function downloadCsv(rows,name){
  const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=name;a.click();
}
loadStats();loadHistory();
</script>
</body>
</html>
